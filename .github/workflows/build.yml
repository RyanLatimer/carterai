name: Apple Silicon app
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apple-silicon-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
      CARGO_TERM_COLOR: always
      MLX_RS_METAL_PATH: ${{ github.workspace }}/target/mlx-metallib
    steps:
      - uses: actions/checkout@v4
      - name: Select modern Metal compiler
        run: |
          sudo xcode-select --switch /Applications/Xcode_26.3.app/Contents/Developer
          xcodebuild -version
          xcrun metal --version
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          cache-directories: target/mlx-metallib
      - name: Configure release signing
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          DEVELOPER_ID_P12_BASE64: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          NOTARY_KEY_BASE64: ${{ secrets.NOTARY_KEY_BASE64 }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/signing-setup.sh
      - name: Verify Apple Silicon runner
        run: test "$(uname -m)" = arm64
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test --release --locked
      - name: Build native Metal app
        run: cargo build --release --locked
      - name: Verify model downloads with the app HTTP client
        run: target/release/carterai --check-downloads
      - name: Verify real-weight Metal inference
        run: |
          mkdir -p /tmp/tiny-gpt2
          base=https://huggingface.co/hf-internal-testing/tiny-random-gpt2/resolve/71034c5d8bde858ff824298bdedc65515b97d2b9
          curl --fail --location --retry 3 "$base/config.json" -o /tmp/tiny-gpt2/config.json
          curl --fail --location --retry 3 "$base/model.safetensors" -o /tmp/tiny-gpt2/model.safetensors
          target/release/carterai --smoke /tmp/tiny-gpt2
          target/release/carterai --smoke-mlx /tmp/tiny-gpt2
      - name: Benchmark real GPT-2 Small (cold and warm, both backends)
        run: |
          mkdir -p /tmp/gpt2-small dist/performance
          base=https://huggingface.co/openai-community/gpt2/resolve/607a30d783dfa663caf39e06633721c8d4cfcd7e
          curl --fail --location --retry 3 "$base/config.json" -o /tmp/gpt2-small/config.json
          curl --fail --location --retry 3 "$base/model.safetensors" -o /tmp/gpt2-small/model.safetensors
          target/release/carterai --smoke /tmp/gpt2-small
          target/release/carterai --smoke-mlx /tmp/gpt2-small
          target/release/carterai --benchmark /tmp/gpt2-small --tokens 32 --prompt-tokens 32 --rounds 3 > dist/performance/candle.json
          target/release/carterai --bench-mlx /tmp/gpt2-small > dist/performance/mlx.json
      - name: Benchmark default GPT-2 Large
        run: |
          mkdir -p /tmp/gpt2-large
          base=https://huggingface.co/openai-community/gpt2-large/resolve/32b71b12589c2f8d625668d2335a01cac3249519
          curl --fail --location --retry 3 "$base/config.json" -o /tmp/gpt2-large/config.json
          curl --fail --location --retry 3 "$base/model.safetensors" -o /tmp/gpt2-large/model.safetensors
          target/release/carterai --benchmark /tmp/gpt2-large --tokens 32 --prompt-tokens 32 --rounds 3 > dist/performance/candle-large.json
          target/release/carterai --bench-mlx /tmp/gpt2-large > dist/performance/mlx-large.json
      - name: Create icon
        run: swift scripts/icon.swift
      - name: Bundle and sign
        env:
          DEVELOPMENT_BUILD: ${{ startsWith(github.ref, 'refs/tags/v') && '0' || '1' }}
        run: scripts/bundle.sh
      - name: Verify bundled MLX resources
        run: dist/Carter.app/Contents/MacOS/Carter --smoke-mlx /tmp/tiny-gpt2
      - name: Verify Finder-launch system-only proxies and PAC
        run: scripts/test-system-proxy.sh
      - name: Notarize, staple, and validate Gatekeeper
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: scripts/notarize.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Carter-Apple-Silicon
          path: dist/Carter-Apple-Silicon.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: performance-reports
          path: dist/performance
      - name: Publish download
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/Carter-Apple-Silicon.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/Carter-Apple-Silicon.zip --title "Carter $GITHUB_REF_NAME" --notes-file RELEASE.md --verify-tag
          fi
      - name: Remove temporary signing credentials
        if: always()
        run: |
          if [[ -f "$RUNNER_TEMP/carter-signing.keychain-db" ]]; then security delete-keychain "$RUNNER_TEMP/carter-signing.keychain-db"; fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary.p8"
