[package]
name = "carterai"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "A quiet, entirely local GPT-2 chat app for Apple Silicon."

[dependencies]
anyhow = "1"
rune = { git = "https://github.com/anomalyco/rune", rev = "61b3b448cb7fdc7d54ec19d4fb02df2f5703815f" }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "61b3b448cb7fdc7d54ec19d4fb02df2f5703815f" }
rune-theme-opencode = { git = "https://github.com/anomalyco/rune", rev = "61b3b448cb7fdc7d54ec19d4fb02df2f5703815f" }
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "system-proxy", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
directories = "6"
rand = "0.9"
fs2 = "0.4"
ipnet = "2"

[build-dependencies]
cc = "1"

[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }
candle-core = { version = "=0.11.1", features = ["metal", "accelerate"] }
candle-nn = { version = "=0.11.1", features = ["metal", "accelerate"] }
accelerate-src = "0.3"
security-framework = "3"
rfd = { version = "0.17", default-features = false }
mlx-rs = { version = "=0.33.0", features = ["metal", "accelerate"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep MLX 0.32.2 usable with macOS 14-era Metal compilers.
[patch.crates-io]
mlx-sys = { path = "vendor/mlx-sys" }
